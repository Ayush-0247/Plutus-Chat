<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plutus</title>
    <meta
      name="description"
      content="Plutus: an ephemeral, end-to-end encrypted chat session."
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f8f6f3;
        --surface: #ffffff;
        --sunken: #f1ede9;
        --border: #e8e2dc;
        --ink: #241b20;
        --ink-soft: #756a6f;
        --ink-faint: #ab9fa3;
        --plum: #7a2048;
        --plum-dark: #601a39;
        --plum-tint: #f8ecf1;
        --plum-tint-border: #f0d6e2;
        --green: #3d9868;
        --green-tint: #e7f5ee;
        --red: #c1443a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .font-display {
        font-family: "Sora", "Inter", sans-serif;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d8d1cb;
        border-radius: 9999px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .rise-in {
        animation: rise 0.25s ease-out both;
      }

      @keyframes sheet-up {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .sheet-up {
        animation: sheet-up 0.28s cubic-bezier(0.32, 0.72, 0, 1) both;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .fade-in {
        animation: fade 0.2s ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        .rise-in,
        .sheet-up,
        .fade-in {
          animation: none !important;
        }
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--plum);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="h-full flex flex-col select-none">
    <!-- MINIMAL TOP BAR -->
    <header
      class="h-16 px-4 sm:px-6 flex items-center justify-between shrink-0"
      style="background: var(--bg)"
    >
      <button
        onclick="toggleSheet()"
        class="flex items-center gap-3 cursor-pointer group"
      >
        <div class="relative shrink-0">
          <div
            class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-[13px] text-white"
            style="background: var(--plum)"
          >
            AR
          </div>
          <span
            class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full"
            style="background: var(--green); border: 2px solid var(--bg)"
          ></span>
        </div>
        <div class="text-left">
          <div
            class="font-display font-bold text-[15px] leading-tight"
            style="color: var(--ink)"
          >
            Ayush Raj
          </div>
          <div class="text-[12px]" style="color: var(--ink-soft)">
            Online, encrypted session
          </div>
        </div>
      </button>

      <button
        onclick="toggleSheet()"
        class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-colors"
        style="
          background: var(--surface);
          border: 1px solid var(--border);
          color: var(--ink-soft);
        "
        title="Session details"
      >
        <svg
          class="w-4.5 h-4.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </header>

    <!-- CHAT -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-6" id="messages-container">
      <div class="max-w-lg mx-auto pt-2 pb-6">
        <!-- Empty state -->
        <div id="empty-state" class="rise-in text-center py-14">
          <div
            class="w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center"
            style="background: var(--plum-tint)"
          >
            <svg
              class="w-6 h-6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--plum)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                opacity="0"
              />
              <rect x="4" y="10" width="16" height="10" rx="2.5" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
          </div>
          <h2
            class="font-display font-bold text-[17px]"
            style="color: var(--ink)"
          >
            You're all set
          </h2>
          <p
            class="mt-1.5 text-[13.5px] max-w-[240px] mx-auto leading-relaxed"
            style="color: var(--ink-soft)"
          >
            Say hello. Messages stay in memory and disappear once this session
            ends.
          </p>
        </div>

        <div id="dynamic-messages" class="space-y-4"></div>
      </div>
    </main>

    <!-- FLOATING INPUT -->
    <footer
      class="shrink-0 px-4 sm:px-6 pb-5 pt-1"
      style="background: linear-gradient(to top, var(--bg) 60%, transparent)"
    >
      <form
        id="message-form"
        onsubmit="sendMessage(event)"
        class="max-w-lg mx-auto flex items-center gap-1.5 p-1.5 rounded-full"
        style="
          background: var(--surface);
          border: 1px solid var(--border);
          box-shadow: 0 8px 24px -8px rgba(36, 27, 32, 0.12);
        "
      >
        <button
          type="button"
          onclick="alert('Attachments stay in memory for this session only.')"
          class="w-9 h-9 rounded-full flex items-center justify-center cursor-pointer shrink-0 transition-colors"
          style="color: var(--ink-faint)"
          title="Attach a file"
        >
          <svg
            class="w-4.5 h-4.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>

        <input
          id="message-input"
          type="text"
          placeholder="Message"
          class="flex-1 bg-transparent outline-none text-[14px] min-w-0"
          style="color: var(--ink)"
          autocomplete="off"
        />

        <button
          type="button"
          onclick="sendVoiceNote()"
          class="hidden sm:flex w-9 h-9 rounded-full items-center justify-center cursor-pointer shrink-0 transition-colors"
          style="color: var(--ink-faint)"
          title="Send a voice note"
        >
          <svg
            class="w-4.5 h-4.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>

        <button
          id="send-btn"
          type="submit"
          class="w-10 h-10 rounded-full flex items-center justify-center text-white cursor-pointer transition-all active:scale-90 shrink-0"
          style="background: var(--plum)"
          title="Send"
        >
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </form>
    </footer>

    <!-- BOTTOM SHEET: SESSION DETAILS -->
    <div
      id="sheet-backdrop"
      onclick="toggleSheet()"
      class="hidden fixed inset-0 bg-black/35 z-40 fade-in"
    ></div>
    <div
      id="sheet"
      class="hidden sheet-up fixed left-0 right-0 bottom-0 z-50 rounded-t-3xl overflow-hidden"
      style="background: var(--surface); max-height: 86vh"
    >
      <div class="flex justify-center pt-3 pb-1">
        <div
          class="w-9 h-1.5 rounded-full"
          style="background: var(--border)"
        ></div>
      </div>

      <div
        class="px-5 pb-6 overflow-y-auto"
        style="max-height: calc(86vh - 24px)"
      >
        <h3
          class="font-display font-bold text-[16px] pt-2 pb-4"
          style="color: var(--ink)"
        >
          Session details
        </h3>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="rounded-2xl p-3.5" style="background: var(--sunken)">
            <div class="flex items-center justify-between mb-1">
              <span
                class="text-[11px] font-semibold"
                style="color: var(--ink-soft)"
                >Session ID</span
              >
              <button
                onclick="copyText('3SDU4H')"
                style="color: var(--ink-soft)"
                class="cursor-pointer"
                title="Copy"
              >
                <svg
                  class="w-3.5 h-3.5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                  />
                </svg>
              </button>
            </div>
            <div
              class="font-display font-bold text-[15px] tracking-wide"
              style="color: var(--ink)"
            >
              3SDU4H
            </div>
          </div>
          <div class="rounded-2xl p-3.5" style="background: var(--plum-tint)">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[11px] font-semibold" style="color: var(--plum)"
                >Passkey</span
              >
              <button
                onclick="copyText('SOLAR-643')"
                style="color: var(--plum)"
                class="cursor-pointer"
                title="Copy"
              >
                <svg
                  class="w-3.5 h-3.5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                  />
                </svg>
              </button>
            </div>
            <div
              class="font-display font-bold text-[15px] tracking-wide"
              style="color: var(--ink)"
            >
              SOLAR-643
            </div>
          </div>
        </div>

        <div
          class="text-[12px] font-semibold mb-2 px-1"
          style="color: var(--ink-soft)"
        >
          Participants
        </div>
        <div
          class="flex items-center justify-between p-3 rounded-2xl mb-5"
          style="background: var(--sunken)"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-[12px] text-white"
              style="background: var(--plum)"
            >
              AR
            </div>
            <div>
              <div
                class="font-semibold text-[13.5px]"
                style="color: var(--ink)"
              >
                Ayush Raj
              </div>
              <div class="text-[11.5px]" style="color: var(--ink-faint)">
                Owner · You
              </div>
            </div>
          </div>
          <span
            class="w-2 h-2 rounded-full"
            style="background: var(--green)"
          ></span>
        </div>

        <div class="space-y-2.5">
          <button
            id="copy-invite-btn"
            onclick="copyInviteLink()"
            class="w-full flex items-center justify-center gap-2 h-12 rounded-2xl text-white text-[14px] font-semibold cursor-pointer transition-colors active:scale-[0.98]"
            style="background: var(--plum)"
          >
            <svg
              class="w-4.5 h-4.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              />
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              />
            </svg>
            <span id="copy-invite-text">Copy invite link</span>
          </button>
          <button
            onclick="testInTab()"
            class="w-full flex items-center justify-center gap-2 h-12 rounded-2xl text-[14px] font-semibold cursor-pointer transition-colors active:scale-[0.98]"
            style="background: var(--sunken); color: var(--ink)"
          >
            Simulate a reply
          </button>
          <button
            id="terminate-btn"
            onclick="terminateSession()"
            class="w-full flex items-center justify-center gap-2 h-12 rounded-2xl text-[14px] font-semibold cursor-pointer transition-colors active:scale-[0.98]"
            style="
              background: transparent;
              color: var(--red);
              border: 1px solid #f0d9d6;
            "
          >
            End session
          </button>
        </div>

        <p class="text-center text-[11px] mt-5" style="color: var(--ink-faint)">
          Memory-only storage · AES-GCM-256
        </p>
      </div>
    </div>

    <!-- TOAST -->
    <div
      id="toast"
      class="fixed bottom-24 left-1/2 -translate-x-1/2 text-[13px] px-4 py-2.5 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-[60] flex items-center gap-2 font-medium"
      style="background: var(--ink); color: #fff"
    >
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="var(--green)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span id="toast-text">Copied</span>
    </div>

    <script>
      function showToast(text) {
        const toast = document.getElementById("toast");
        document.getElementById("toast-text").innerText = text;
        toast.style.opacity = "1";
        setTimeout(() => {
          toast.style.opacity = "0";
        }, 2000);
      }

      function copyText(text) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("Copied: " + text));
      }

      function copyInviteLink() {
        const link = window.location.origin + "?session=3SDU4H&key=SOLAR-643";
        navigator.clipboard.writeText(link).then(() => {
          showToast("Invite link copied");
          const btnText = document.getElementById("copy-invite-text");
          btnText.innerText = "Copied";
          setTimeout(() => {
            btnText.innerText = "Copy invite link";
          }, 1800);
        });
      }

      function toggleSheet() {
        const sheet = document.getElementById("sheet");
        const backdrop = document.getElementById("sheet-backdrop");
        const isHidden = sheet.classList.contains("hidden");
        if (isHidden) {
          sheet.classList.remove("hidden");
          backdrop.classList.remove("hidden");
        } else {
          sheet.classList.add("hidden");
          backdrop.classList.add("hidden");
        }
      }

      function testInTab() {
        toggleSheet();
        setTimeout(() => {
          appendMessage(
            "AR",
            "Ping confirmed on this line. Ready when you are.",
            "peer",
          );
        }, 450);
      }

      function terminateSession() {
        if (
          confirm(
            "End this session? Every message in this window will be cleared immediately.",
          )
        ) {
          document.getElementById("dynamic-messages").innerHTML = "";
          document.getElementById("empty-state").classList.remove("hidden");
          toggleSheet();
          showToast("Session ended and cleared");
        }
      }

      function sendVoiceNote() {
        sendMessageCore("Voice note · 0:05");
      }

      function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById("message-input");
        const text = input.value.trim();
        if (!text) return;
        sendMessageCore(text);
        input.value = "";
      }

      function nowStr() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function appendMessage(who, text, kind) {
        document.getElementById("empty-state").classList.add("hidden");
        const container = document.getElementById("dynamic-messages");
        const row = document.createElement("div");

        if (kind === "self") {
          row.className = "rise-in flex flex-col items-end gap-1";
          row.innerHTML =
            '<div class="max-w-[80%] px-4 py-2.5 rounded-[20px] text-[14px] leading-snug" style="background: var(--plum-tint); color: var(--ink);">' +
            escapeHtml(text) +
            "</div>" +
            '<span class="text-[10.5px] pr-1" style="color: var(--ink-faint);">' +
            nowStr() +
            "</span>";
        } else {
          row.className = "rise-in flex flex-col items-start gap-1";
          row.innerHTML =
            '<div class="max-w-[80%] px-4 py-2.5 rounded-[20px] text-[14px] leading-snug" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">' +
            escapeHtml(text) +
            "</div>" +
            '<span class="text-[10.5px] pl-1" style="color: var(--ink-faint);">' +
            who +
            " · " +
            nowStr() +
            "</span>";
        }

        container.appendChild(row);
        row.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function sendMessageCore(text) {
        appendMessage("You", text, "self");

        if (!text.includes("Voice note")) {
          setTimeout(() => {
            const replies = [
              "Got it, reading now.",
              "Confirmed — nothing's written to disk.",
              "Looks good from this end.",
              "Encryption checks out on my side too.",
            ];
            const randomReply =
              replies[Math.floor(Math.random() * replies.length)];
            appendMessage("AR", randomReply, "peer");
          }, 800);
        }
      }

      function escapeHtml(string) {
        return String(string).replace(/[&<>"'`=\/]/g, function (s) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
            "/": "&#x2F;",
          }[s];
        });
      }
    </script>
  </body>
</html>
