name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Lightning CSS Linux binary
        run: npm install --no-save --force lightningcss@latest

      - name: Verify Lightning CSS
        run: |
          node -e "require('lightningcss'); console.log('Lightning CSS loaded successfully')"

      - name: Verify Tailwind CSS Oxide
        run: |
          node -e "require('@tailwindcss/oxide'); console.log('Tailwind Oxide loaded successfully')"

      - name: Run linter
        run: npm run lint

      - name: Security audit check
        run: npm audit --audit-level=high

      - name: Clean previous build
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Build frontend with Vite
        run: |
          echo "Starting frontend build..."
          npx vite build

          echo ""
          echo "Vite build completed."
          echo "Contents of dist:"
          ls -lah dist

      - name: Verify frontend build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Vite build did not generate dist/index.html"
            exit 1
          fi

          echo "Frontend build verified successfully."

      - name: Build server with esbuild
        run: |
          echo "Starting server bundle..."

          npx esbuild server.js \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --sourcemap \
            --outfile=dist/server.cjs

          echo ""
          echo "Server build completed."

      - name: Verify build artifacts
        run: |
          echo "Verifying final build artifacts..."

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html is missing."
            exit 1
          fi

          if [ ! -f "dist/server.cjs" ]; then
            echo "::error::dist/server.cjs is missing."
            exit 1
          fi

          echo ""
          echo "Build artifacts verified successfully."
          ls -lah dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutus-chat-dist
          path: dist/
          retention-days: 5

  deploy:
    name: Deploy to Render (CD)
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "CI passed, but Render deployment was skipped."
            exit 0
          fi

          echo "Triggering Render deployment..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            "$RENDER_DEPLOY_HOOK")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Render response HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Render deployment successfully triggered."
          else
            echo "::error::Failed to trigger Render deployment."
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi


